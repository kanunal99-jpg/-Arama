name: Android APK & OTA Release

# Release pipeline trigger: hardened binary/release validation.
on:
  push:
    branches: [main]
    paths-ignore:
      - release/latest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify production API configuration
        shell: bash
        env:
          ARAMA_API_BASE_URL: ${{ secrets.ARAMA_API_BASE_URL }}
        run: |
          test -n "$ARAMA_API_BASE_URL" || { echo "Missing ARAMA_API_BASE_URL secret; refusing to publish a non-functional production APK."; exit 1; }
          case "$ARAMA_API_BASE_URL" in
            https://*) ;;
            *) echo "ARAMA_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          case "$ARAMA_API_BASE_URL" in
            */) echo "ARAMA_API_BASE_URL must not end with /."; exit 1 ;;
          esac

      - name: Verify release signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.p12
          test -s app/release-keystore.p12

      - name: Calculate release version
        id: version
        shell: bash
        working-directory: .
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed release APK
        env:
          ARAMA_API_BASE_URL: ${{ secrets.ARAMA_API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} -PapiBaseUrl="$ARAMA_API_BASE_URL"

      - name: Validate APK binary, package, version, alignment and signature
        id: validate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          echo "== File =="
          stat -c 'APK bytes: %s' "$APK"

          echo "== ZIP integrity =="
          unzip -t "$APK" >/dev/null
          echo "APK ZIP integrity: OK"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "== APK metadata =="
          BADGING="$($AAPT2 dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.arama.app'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='${{ steps.version.outputs.version_code }}'" >/dev/null
          echo "$BADGING" | grep -F "versionName='${{ steps.version.outputs.version_name }}'" >/dev/null
          echo "Package/version validation: OK"

          echo "== ZIP alignment =="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          echo "zipalign validation: OK"

          echo "== APK signature =="
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature validation: OK"

          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE_BYTES="$(stat -c '%s' "$APK")"
          test "${#SHA256}" -eq 64
          test "$SIZE_BYTES" -gt 0
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256"
          echo "APK size: $SIZE_BYTES bytes"

      - name: Prepare release asset
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/arama-release.apk
          test -s app/build/outputs/apk/release/arama-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: android-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          name: ARAMA Android v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/arama-release.apk

      - name: Download and re-validate published release asset
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_SHA256: ${{ steps.validate.outputs.sha256 }}
          EXPECTED_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
        run: |
          TAG="android-v${VERSION_NAME}-${VERSION_CODE}"
          rm -f /tmp/arama-release.apk
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'arama-release.apk' --dir /tmp
          test -s /tmp/arama-release.apk

          ACTUAL_SHA256=$(sha256sum /tmp/arama-release.apk | cut -d' ' -f1)
          ACTUAL_SIZE_BYTES=$(stat -c '%s' /tmp/arama-release.apk)
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_SIZE_BYTES" = "$EXPECTED_SIZE_BYTES"

          unzip -t /tmp/arama-release.apk >/dev/null
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -n 1)"
          BADGING="$($AAPT2 dump badging /tmp/arama-release.apk)"
          echo "$BADGING" | grep -F "package: name='com.arama.app'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'" >/dev/null
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 /tmp/arama-release.apk
          "$APKSIGNER" verify --verbose /tmp/arama-release.apk

          echo "Published asset binary validation: OK"
          echo "Published asset SHA-256: $ACTUAL_SHA256"
          echo "Published asset size: $ACTUAL_SIZE_BYTES bytes"

      - name: Update OTA manifest
        shell: bash
        working-directory: .
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SHA256: ${{ steps.validate.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
        run: |
          python - <<'PY'
          import json, os
          path = 'release/latest.json'
          data = {
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': os.environ['VERSION_NAME'],
              'packageName': 'com.arama.app',
              'apkUrl': f"https://github.com/kanunal99-jpg/-Arama/releases/download/android-v{os.environ['VERSION_NAME']}-{os.environ['VERSION_CODE']}/arama-release.apk",
              'sha256': os.environ['SHA256'],
              'sizeBytes': int(os.environ['SIZE_BYTES']),
              'mandatory': False,
              'releaseNotes': 'ARAMA Android otomatik OTA sürümü'
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          python -m json.tool release/latest.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          if git diff --cached --quiet; then
            echo "OTA manifest already current."
          else
            git commit -m "chore(android): update OTA manifest [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify OTA manifest
        shell: bash
        working-directory: .
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_SHA256: ${{ steps.validate.outputs.sha256 }}
          EXPECTED_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
        run: |
          python - <<'PY'
          import json, os
          with open('release/latest.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['versionCode'] == int(os.environ['VERSION_CODE'])
          assert data['versionName'] == os.environ['VERSION_NAME']
          assert data['packageName'] == 'com.arama.app'
          assert data['apkUrl'].endswith('/arama-release.apk')
          assert data['sha256'] == os.environ['EXPECTED_SHA256']
          assert data['sizeBytes'] == int(os.environ['EXPECTED_SIZE_BYTES'])
          assert len(data['sha256']) == 64
          print('OTA manifest verified:', data)
          PY
