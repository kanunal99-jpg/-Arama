name: Android APK & OTA Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          name: ARAMA Android v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk

      - name: Update OTA manifest
        working-directory: .
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          path = 'release/latest.json'
          data = {
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': os.environ['VERSION_NAME'],
              'apkUrl': f"https://github.com/kanunal99-jpg/-Arama/releases/download/android-v{os.environ['VERSION_NAME']}-{os.environ['VERSION_CODE']}/arama-release.apk",
              'sha256': os.environ['SHA256'],
              'mandatory': False,
              'releaseNotes': 'ARAMA Android otomatik OTA sürümü'
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          git diff --cached --quiet || git commit -m "chore(android): update OTA manifest"
          git push

      - name: Verify OTA manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('release/latest.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['versionCode'] > 0
          assert data['versionName']
          assert data['apkUrl'].endswith('/arama-release.apk')
          assert len(data['sha256']) == 64
          print('OTA manifest verified:', data)
          PY
